evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 80000
  save_name: FoundationGait_L143216_C8421
  eval_func: evaluate_Gait3D
  sampler:
    batch_shuffle: false
    batch_size: 1
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: FoundationGait_Scaling
  Backbone:
    mode: p3d
    in_channels: 1
    layers:
      - 1
      - 4
      - 32
      - 16
    channels: 
      - 64
      - 128 
      - 256
      - 512
  bin_num: [16,8,4,2,1]
  parts_num: 31
  crop_list: [8,4,2,1]
  EMA_value: 0.99

optimizer_cfg:
  lr: 0.05
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  scheduler: CosineAnnealingLR
  T_max: 80000
  eta_min: 0.00001

trainer_cfg:
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: True
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 2000
  save_name: FoundationGait_L143216_C8421
  sync_BN: true
  total_iter: 80000
  sampler:
    batch_shuffle: true
    batch_size:
      - 8  # TripletSampler, batch_size[0] indicates Number of Identity
      - 64 # batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 16 # fixed frames number for training
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    frames_skip_num: 4
    type: BilateralSampler
  transform:
    - - type: DA4GaitSSB
      - type: DA4GaitSSB
