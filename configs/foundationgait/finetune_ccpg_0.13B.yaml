data_cfg:
  dataset_name: CCPG
  dataset_root: xxx
  dataset_partition: datasets/CCPG/CCPG.json
  data_in_use: [True] # images / real_ratios
  num_workers: 1
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: CCPG
  cache: false

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: true
  restore_hint: 10000
  save_name: FoundationGait_Scaling_L143216_C4821_B832_Stage1of1_10k_wd5_C8421
  eval_func: evaluate_CCPG
  sampler:
    batch_shuffle: false
    batch_size: 8
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 720 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseSilCuttingTransform

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: FoundationGait_Scaling_Finetune
  crop_list: [8, 4, 2, 1, 8, 4, 2, 1]
  Backbone:
    mode: p3d
    in_channels: 1
    layers:
      - 1
      - 4
      - 32
      - 16
    channels: 
      - 64
      - 128 
      - 256
      - 512
  bin_num: [16,8,4,2,1]
  parts_num: 31
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 31
  SeparateBNNecks:
    class_num: 100
    in_channels: 256
    parts_num: 31
  backbone_lr: [0.0, 0.0, 0.0, 0.001, 0.005]
  projector_lr: 0.01

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 2000
    - 3000
  scheduler: MultiStepLR

trainer_cfg:
  find_unused_parameters: True
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: True
  
  # restore_ckpt_strict: true
  # restore_hint: 0
  
  restore_ckpt_strict: False
  restore_hint: xxx # from pretraining model
  optimizer_reset: True
  scheduler_reset: True

  save_iter: 1000
  save_name: FoundationGait_Scaling_L143216_C4821_B832_Stage1of1_10k_wd5_C8421
  sync_BN: true
  total_iter: 5000
  sampler:
    batch_shuffle: true
    batch_size:
      - 8  # TripletSampler, batch_size[0] indicates Number of Identity
      - 32 # batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 30 # fixed frames number for training
    sample_type: fixed_ordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    frames_skip_num: 4
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomPerspective
          prob: 0.2
        - type: BaseSilCuttingTransform
        - type: RandomHorizontalFlip
          prob: 0.2
        - type: RandomRotate
          prob: 0.2